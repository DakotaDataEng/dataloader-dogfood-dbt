version: 2

models:
  - name: fct_daily_orders_by_customer
    description: Orders per customer, order date and currency.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CAD", "USD", "EUR"]

  - name: mart_customer_360
    description: One row per customer. Customer fields, order counts by status, total and average order amount, first and last order times, and days with orders. Amounts add up across currencies. Customers with no orders have zero counts.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_name
        data_tests: [not_null]
      - name: country
        data_tests: [not_null]
      - name: segment
        data_tests: [not_null]
