version: 2

models:
  - name: fct_daily_orders_by_customer
    description: Orders per customer, order date and currency.
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CAD", "USD", "EUR"]
